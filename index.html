<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Samsung Retail Curator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F2;
  --white: #FFFFFF;
  --ink: #1C1C1C;
  --blue: #2189FF;
  --ink-3: rgba(28,28,28,0.42);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

/* ── BLACK PRESENTATION BACKGROUND ── */
body { 
  background: #000000; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  min-height: 100vh; 
  font-family: 'DM Sans', sans-serif;
  overflow: hidden; /* Keeps the focus on the phone */
}

/* ── GALAXY S26 ULTRA SHELL ── */
.phone {
  width: 390px;
  height: 844px;
  background: var(--bg);
  border-radius: 32px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 0 10px #1A1A1A, 0 30px 100px rgba(0,0,0,0.9);
}
.phone::before {
  content: ''; position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
  width: 10px; height: 10px; background: #000; border-radius: 50%; z-index: 10001;
}

/* ── TOUR & OVERLAY ── */
#tour-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 10000;
  display: none;
}

.highlight-target {
  position: relative !important;
  z-index: 10001 !important;
  box-shadow: 0 0 0 10px rgba(33, 137, 255, 0.4), 0 20px 40px rgba(0,0,0,0.5);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.tour-callout {
  position: absolute;
  top: 115%;
  left: 50%;
  transform: translateX(-50%);
  width: 260px;
  background: var(--blue);
  color: white;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  animation: float 2.5s infinite ease-in-out;
}

.tour-callout::after {
  content: ''; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  border: 12px solid transparent; border-bottom-color: var(--blue);
}
