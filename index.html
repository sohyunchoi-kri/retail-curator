<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Samsung In-Store Experience</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── BASE THEME ── */
:root {
  --bg: #F7F5F2; --white: #FFFFFF; --ink: #1C1C1C; --ink-2: #313131;
  --ink-3: rgba(28,28,28,0.42); --ink-4: rgba(28,28,28,0.22);
  --line: rgba(28,28,28,0.08); --line-2: rgba(28,28,28,0.13);
  --blue: #2189FF; --blue-bg: rgba(33,137,255,0.07); --blue-bd: rgba(33,137,255,0.18);
  --teal: #00838F; --coral: #F36E6E; --red: #EF3434;
  --font: 'DM Sans', -apple-system, sans-serif; --r: 10px; --r-lg: 16px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

/* ── PRESENTATION WRAPPER ── */
body { 
  background: #000; /* Black outer background */
  display: flex; align-items: center; justify-content: center; 
  min-height: 100vh; font-family: var(--font); overflow: hidden;
}

.phone {
  width: 390px; height: 844px; background: var(--bg); border-radius: 28px;
  overflow: hidden; position: relative; display: flex; flex-direction: column;
  box-shadow: 0 0 0 2px #1c1c1c, 0 0 0 8px #333, 0 40px 80px rgba(0,0,0,0.8);
  z-index: 10;
}

/* ── TOUR & HIGHLIGHTS ── */
#tour-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: 10000; display: none; }
.highlight-target { position: relative !important; z-index: 10001 !important; box-shadow: 0 0 0 10px rgba(33, 137, 255, 0.4) !important; pointer-events: none; }
.tour-callout { 
  position: absolute; top: 115%; left: 50%; transform: translateX(-50%); width: 280px; 
  background: var(--blue); color: white; padding: 18px; border-radius: 20px; 
  text-align: center; z-index: 10005; animation: float 2.5s infinite ease-in-out;
}
.tour-callout::after { content: ''; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); border: 12px solid transparent; border-bottom-color: var(--blue); }

@keyframes float { 0%,100% {transform:translate(-50%,0)} 50% {transform:translate(-50%,-10px)} }

/* ── COLLECT OPTIONS ── */
.options-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 500; display: none; align-items: flex-end; }
.options-modal.open { display: flex; }
.options-content { background: var(--white); width: 100%; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
.options-modal.open .options-content { transform: translateY(0); }
.option-row { display: flex; align-items: center; gap: 15px; padding: 18px; background: var(--bg); border-radius: var(--r-lg); margin-bottom: 10px; cursor: pointer; }

/* ── IMPORTED UI (From your retail curator.html) ── */
.site-header { background: var(--white); border-bottom: 1px solid var(--line); flex-shrink: 0; position: sticky; top: 0; z-index: 50; padding-top: 40px; }
.header-main { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 15px; }
.page { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.scan-banner { margin: 15px 20px; background: linear-gradient(135deg, #1A1C2E 0%, #303454 100%); border-radius: var(--r-lg); padding: 20px; display: flex; align-items: center; gap: 15px; color: white; cursor: pointer; }
.stamp-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; margin-bottom: 16px; }
.btn-collect { width: 100%; margin-top: 15px; background: var(--blue); color: white; border: none; padding: 14px; border-radius: var(--r); font-weight: 700; cursor: pointer; font-family: var(--font); }

/* ... (Remaining Original Detail Screens and Scanner CSS) ... */
</style>
</head>
<body>

<div class="phone">
  <div id="tour-overlay"></div>

  <header class="site-header">
    <div class="header-main">
      <div style="font-weight:700; font-size:18px;">🏪 Retail Curator</div>
      <div style="display:flex; gap:12px; align-items:center;">
        <div style="font-weight:700; color:var(--blue); font-size:14px;">◈ <span id="hStamp">0</span></div>
        <div style="width:28px; height:28px; border:1px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px;">👤</div>
      </div>
    </div>
  </header>

  <div class="page" id="page">
    <div style="padding: 24px 20px;">
      <h1 style="font-size: 24px; letter-spacing: -1px;">Welcome to Store</h1>
      <p style="font-size: 13px; color: var(--ink-3); margin-top: 4px;">Explore today's lineup and earn rewards.</p>
    </div>

    <div class="scan-banner" id="aiBanner" onclick="openScanner()">
      <div style="width:50px; height:50px; background:rgba(255,255,255,0.1); border-radius:10px;"></div>
      <div>
        <h4 style="font-size: 15px;">✨ Galaxy AI Explore</h4>
        <p style="font-size: 11px; opacity: 0.8;">Scan a product to start earning stamps</p>
      </div>
    </div>

    <div class="section section-bg" id="stampSec">
      <div class="stamp-card">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:15px;">
          <div style="font-weight:700; font-size:16px;">Demo Stamps</div>
          <div style="font-size:24px; font-weight:700;"><span id="bigStamp">0</span><span style="font-size:13px; color:#AAA;">/8</span></div>
        </div>
        <div id="dots" style="display:grid; grid-template-columns:repeat(8,1fr); gap:5px; margin-bottom:15px;"></div>
        <button class="btn-collect" onclick="showOptions()">Collect stamps</button>
      </div>
    </div>
  </div>

  <div class="options-modal" id="optModal" onclick="hideOptions()">
    <div class="options-content" onclick="event.stopPropagation()">
      <div style="width:30px; height:4px; background:#ddd; border-radius:2px; margin:0 auto 20px;"></div>
      <h3 style="font-size:18px; margin-bottom:15px;">Earn your next stamp</h3>
      <div class="option-row" onclick="hideOptions(); openScanner();">
        <div style="font-size:22px;">📷</div>
        <div>
          <div style="font-weight:700; font-size:14px;">Explore Products</div>
          <div style="font-size:12px; color:var(--ink-3);">Scan QR codes on the floor</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let stamps = 0;

// ── TOUR SCRIPT ──
window.onload = function() {
  if (!localStorage.getItem('seenTour')) {
    setTimeout(() => {
      const overlay = document.getElementById('tour-overlay');
      const target = document.getElementById('aiBanner');
      overlay.style.display = 'block';
      target.classList.add('highlight-target');
      
      const callout = document.createElement('div');
      callout.className = 'tour-callout';
      callout.id = 'tourCallout';
      callout.innerHTML = `
        <p style="font-weight:500;">Scan and explore a product in-store to start earning stamps.</p>
        <button onclick="endTour()" style="margin-top:12px; background:#fff; border:none; padding:8px 20px; border-radius:20px; font-weight:700; cursor:pointer;">Got it!</button>
      `;
      target.appendChild(callout);
    }, 1000);
  }
};

function endTour() {
  document.getElementById('tour-overlay').style.display = 'none';
  document.getElementById('aiBanner').classList.remove('highlight-target');
  document.getElementById('tourCallout').remove();
  localStorage.setItem('seenTour', 'true');
}

// ── UI LOGIC ──
function showOptions() { document.getElementById('optModal').classList.add('open'); }
function hideOptions() { document.getElementById('optModal').classList.remove('open'); }
function openScanner() { alert('Camera Scanner Simulation Opening...'); }

function renderStamps() {
  const d = document.getElementById('dots'); d.innerHTML = '';
  for(let i=0; i<8; i++) {
    const dot = document.createElement('div');
    dot.style = `aspect-ratio:1; border-radius:6px; background:${i < stamps ? 'var(--blue)' : '#f0f0f0'}; border:1px solid #ddd;`;
    d.appendChild(dot);
  }
}
renderStamps();
</script>
</body>
</html>
